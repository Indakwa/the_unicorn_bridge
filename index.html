<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rainbow Bridge - Swipe bubbles</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <canvas id="game"></canvas>
    <div id="pauseButton">
        <button id="pauseToggle">PAUSE</button>
        <button id="homeButton">HOME</button>
        </div>
        
        <div id="gameOverHomeButton">
    <button id="gameOverHome">GO HOME</button>
</div>

        <div id="startScreen">
            <h1>THE RAINBOW BRIDGE</h1>
            <p>Swipe bubbles of the required color to build the Rainbow Bridge and help the Unicorn get home!</p>
<div id="levelSelect">
  <p>SELECT LEVEL</p>
  <div>
    <button data-level="1" class="selected">1</button>
    <button data-level="2">2</button>
    <button data-level="3">3</button>
    <button data-level="4">4</button>
    <button data-level="5">5</button>
    <button data-level="6">6</button>
    <button data-level="7">BOSS</button>
  </div>
</div>
            <button id="playButton">PLAY</button>
        </div>
        
        <div id="winScreen">
            <div id="winConfetti"></div>
        <h1 id="winTitle">YOU WIN!</h1>
        <p>You built the Rainbow Bridge. The Unicorn is now home!</p>
        <p id="finalScore">Your Score: 0</p>
        <button id="nextLevelButton">NEXT LEVEL</button>
        <button id="playAgainButton">PLAY AGAIN</button>
    </div>

    <div id="mobileNotice">This game is designed for touch, play it on mobile :)</div>

    <script src="src/game.js"></script>

</body>

</html>
